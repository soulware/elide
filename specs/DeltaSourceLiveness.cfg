\* TLC model configuration for DeltaSourceLiveness.tla
\*
\* Run with:
\*   tlc specs/DeltaSourceLiveness.tla -config specs/DeltaSourceLiveness.cfg
\*
\* Or with the VS Code TLA+ extension (tlaplus.tlaplus):
\*   Cmd+Shift+P → "TLA+: Check Model"
\*
\* MAX_EXTENTS = 3 is enough for every counterexample the module's
\* header describes: one extent to become the delta source, one to be
\* the promote's target, and one spare so a plan's drop set can be
\* non-trivial while another extent stays referenced.
\*
\* Expected output: every invariant and property holds.
\*
\* Each of the three mechanisms can be switched off in the .tla file to
\* produce a counterexample to NoDanglingDeltaSource; the header lists
\* the edit and the expected trace for each.

SPECIFICATION Spec

CONSTANTS
  MAX_EXTENTS = 3

INVARIANTS
  TypeOK
  NoDanglingDeltaSource
  DeltaSourceReferenced

PROPERTIES
  NoApplyInsidePromote
  DeferredEventuallyApplies

\* Write and StartPromote are bounded by `written`, so once every extent
\* has been written the model reaches states with no enabled action.
\* That is exhaustion of the bound, not a deadlock in the protocol.
CHECK_DEADLOCK FALSE
