\* TLC model configuration for HandoffProtocol.tla — tombstone (all-dead) case.
\*
\* Models a handoff whose plan carries nothing: the coordinator found every
\* entry in the input dead. The volume still materialises and commits a real
\* zero-entry output naming its inputs, which is its acknowledgment that they
\* are safe to delete. promote_segment recognises the zero-entry shape and
\* skips the new idx and cache body, deleting only the input idx files.
\*
\* This config carries a case the standard one cannot reach. With
\* Carried # {}, CoordFinalize's `new_seg_present` conjunct already implies
\* promote has run and so implies ~old_idx_present, which leaves the explicit
\* ordering guard redundant. Here `new_seg_present \/ Carried = {}` is
\* trivially true, so `~old_idx_present` is the only thing keeping the S3
\* delete behind the idx delete, and OldIdxOnlyPresentWhenSegmentPresent has
\* teeth only under this config.
\*
\* Run with:
\*   tlc specs/HandoffProtocol.tla -config specs/HandoffProtocol_Tombstone.cfg

SPECIFICATION Spec

\* See HandoffProtocol.cfg for the rationale for disabling deadlock detection.
CHECK_DEADLOCK FALSE

CONSTANTS
  \* Tombstone: no hashes carried or dropped — the input is fully dead.
  Carried = {}
  Removed = {}
  Dead = TRUE
  \* See HandoffProtocol.cfg for rationale.
  MaxCrashes = 3

INVARIANTS
  TypeOK
  NoSegmentNotFound
  NoLostData
  OldOnlyDeletedAfterApplied
  OldIdxOnlyPresentWhenSegmentPresent
  CacheOnlyAfterUpload
  NoCommitOnStaleView
  RefusalIsNotProgress

PROPERTIES
  EventuallyDoneWhenViewSettles
